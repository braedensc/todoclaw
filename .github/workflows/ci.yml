name: CI

# Layer 3 of the security/quality model — the unbypassable gate (--no-verify can't skip it).
# Four parallel jobs run on every push to main and every PR:
#   - "Secret scan + forbidden paths" — secretlint + planning/.env path gate (Stage 1)
#   - "Lint"      — ESLint + Prettier check        (Stage 2 PR #2 tooling)
#   - "Typecheck" — tsc -b                          (Stage 2 PR #2 tooling)
#   - "Test"      — Vitest (unit + component)       (Stage 2 PR #2 tooling)
#   - "Deno"      — deno check + deno test (edge functions — the tree tsc/eslint skip)
# Each job's `name:` IS the required-status-check context. After this PR merges, add
# "Lint", "Typecheck", and "Test" to main's required checks (see docs/SERVICES.md /
# ADR-0010) — only once they've reported, or open PRs would wedge waiting on them.

on:
  push:
    branches: [main]
  # Run on every PR regardless of base branch — so stacked PRs (base != main) are gated too,
  # not just PRs that target main directly. `labeled`/`unlabeled` are included so the
  # "Hooks change guard" below re-evaluates the moment a `hooks-change` label is added or
  # removed (the default PR activity types — opened/synchronize/reopened — don't cover labels).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  secrets-and-paths:
    name: Secret scan + forbidden paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block forbidden paths (planning/, real .env)
        run: |
          FORBIDDEN=$(git ls-files \
            | grep -E '^planning/|(^|/)\.env' \
            | grep -v -E '(^|/)\.env\.example$' \
            || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden files are tracked in git:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: secretlint (scan all tracked files)
        run: git ls-files -z | xargs -0 npx secretlint --secretlintrc .secretlintrc.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc -b
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest (unit + component)
        run: npm test

  # Deno edge-function gate. The frontend jobs above SKIP supabase/functions/ (tsc -b + eslint
  # ignore that tree — it runs Deno, not Node), so until now nothing in CI type-checked or tested
  # the server-side capability/guardrail/prompt logic — the exact gap behind the "three-readers"
  # class of bugs. This job closes it: `deno check` type-checks the shared modules + every function
  # entrypoint, and `deno task test` runs the 213-test suite. Verified locally before adding.
  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check (deno check — shared modules, capabilities + function entrypoints)
        working-directory: supabase/functions
        run: deno check _shared/*.ts _shared/capabilities/*.ts */index.ts

      - name: Deno unit tests
        working-directory: supabase/functions
        run: deno task test

  # Playwright smoke. NOT a required check yet (promote once it's proven stable) so a flaky
  # browser run can't wedge main. chromium-only + dummy Supabase env (see playwright.config.ts).
  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npm run test:e2e

  # Migration guard — hard, deterministic feedback on the two mistakes that wedged the prod deploy
  # on 2026-07-09: a DUPLICATE migration version (schema_migrations PK collision) or an OUT-OF-ORDER
  # one (sorts before main's latest → `supabase db push` hard-stops and applies nothing further).
  # PR-only and compares against the freshly-fetched main tip, so a parallel branch that grabbed the
  # same/earlier timestamp fails HERE instead of silently after merge. See scripts/check-migrations.mjs.
  migration-guard:
    name: Migration guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch main (the base to compare against)
        run: git fetch --no-tags --depth=1 origin main

      - name: Check migration versions (no duplicates, newest-last)
        env:
          BASE_REF: FETCH_HEAD
        run: node scripts/check-migrations.mjs

  # GAP 1 (audit 2026-07-06) CI backstop. `.claude/settings.json` sets
  # defaultMode=bypassPermissions, so the PreToolUse hook is the only local runtime gate.
  # Even if that local guard is somehow disabled, a PR that changes the guard machinery
  # (.claude/hooks/** or .claude/settings.json) must not merge unnoticed — it has to carry
  # an explicit `hooks-change` label. This flag only becomes a real gate once branch
  # protection requires a review (required_approving_review_count >= 1, owner-set in the
  # GitHub UI) so a human actually sees it. PR-only (a push to main has no label context).
  hooks-change-guard:
    name: Hooks change guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the 'hooks-change' label to edit hook/settings files
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          SENSITIVE=$(printf '%s\n' "$CHANGED" | grep -E '^\.claude/(hooks/|settings\.json$)' || true)
          if [ -z "$SENSITIVE" ]; then
            echo "No security-hook files changed — nothing to gate."
            exit 0
          fi
          echo "This PR modifies security-critical hook/settings files:"
          printf '  %s\n' $SENSITIVE
          for label in $LABELS; do
            if [ "$label" = "hooks-change" ]; then
              echo "OK: 'hooks-change' label present — change acknowledged."
              exit 0
            fi
          done
          echo "::error::This PR changes .claude/hooks/** or .claude/settings.json. Those files are the local security guard under bypassPermissions, so edits must be reviewed — not silent. Add the 'hooks-change' label to acknowledge, then this check re-runs."
          exit 1

  # RLS coverage (static) — every table in the `public` schema must enable Row Level Security. RLS
  # is the multi-tenant boundary and the public anon key ships in the client bundle, so a public
  # table without RLS is open to anyone holding that key. Deterministic, no DB, no deps — runs on
  # every push + PR. Scans the migrations (scripts/check-rls.mjs). Promote to a required check once
  # it has reported on a few PRs.
  rls-static:
    name: RLS coverage (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert every public table enables RLS (migration scan)
        run: node scripts/check-rls.mjs

  # RLS coverage (live DB) — applies the migrations to a real Supabase stack and asserts, against
  # the ACTUAL database, that every public table enforces RLS, that no policy is blanket-`true` for
  # anon/authenticated, and (end-to-end) that the public anon key cannot read an RLS-protected table
  # through PostgREST. Heavier (boots the local stack) so NOT required yet — promote once stable.
  # See scripts/check-rls-live.mjs.
  rls-live:
    name: RLS coverage (live DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Run the live RLS check against the running stack
        run: |
          set -euo pipefail
          source <(supabase status -o env)
          SUPABASE_DB_URL="$DB_URL" \
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
            node scripts/check-rls-live.mjs

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  # Volume-bound coverage (static) — RLS answers WHOSE rows a user touches; it says nothing about HOW
  # MANY / HOW BIG. Every table with a direct `insert` grant to a user role must have a per-user
  # row-cap trigger + a size CHECK on unbounded text/jsonb (or a reviewed allowlist entry), so no
  # storage-bomb / prompt-injection surface merges unnoticed. Deterministic, no DB, no deps.
  # See scripts/check-write-caps.mjs and CLAUDE.md "Security Model" rule (i).
  write-caps:
    name: Volume-bound coverage (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert every user-writable table is volume-bounded (migration scan)
        run: node scripts/check-write-caps.mjs

  # DEFINER-scope coverage (static) — a SECURITY DEFINER function bypasses the RLS of the tables it
  # writes, so RLS is not protecting them. Every DEFINER function granted to a user role must carry a
  # reviewed scoping entry (writes fenced to auth.uid(), or a justified exception) — the review step
  # that weather_cache_put (#310) never got. A new such grant with no entry fails here.
  # See scripts/check-definer-grants.mjs and CLAUDE.md "Security Model" rule (ii).
  definer-grants:
    name: DEFINER-scope coverage (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert every DEFINER function granted to users is scope-reviewed (migration scan)
        run: node scripts/check-definer-grants.mjs

  # Edge-fetch lint (static) — every outbound fetch in supabase/functions must pass an
  # AbortSignal/timeout (or one dead endpoint hangs the dispatch cron), and a URL sourced from
  # user-stored DB data must be a constant/env host or host-allowlisted (SSRF). Deterministic, no
  # DB, no deps. See scripts/check-edge-fetch.mjs.
  edge-fetch:
    name: Edge-fetch lint (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert every edge fetch is timeout-bounded + host-safe
        run: node scripts/check-edge-fetch.mjs

  # Hook battery — pre-tool-use.py is the ENTIRE local runtime gate (settings.json sets
  # defaultMode=bypassPermissions), so a guard that silently stops matching is a hole nobody
  # sees. The battery asserts a block/allow pair for each guard against throwaway git repos
  # (a copy of the hook inside each, so branch/worktree guards judge the sandbox, not the CI
  # checkout) plus a mocked `gh`, so it needs no network and no DB. python3 + git only —
  # `npm run test:hooks` is the same entry point humans and agents use locally, since the
  # hook's own self-edit guard blocks `python3 .claude/hooks/test_hooks.py`.
  hook-battery:
    name: Hook battery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert every pre-tool-use guard still blocks (and still allows)
        run: npm run test:hooks

  # Pipeline contract validators — docs/PIPELINE-CONTRACT.md and schemas/ are two
  # renderings of ONE truth, and prose that agents read cannot enforce itself. These
  # were vendored from claude-project-kit (#390/#392) but nothing ran them here, so
  # the contract's own "CI fails if these disagree" claim was unbacked in this repo.
  # Two validators, each run twice: `--selftest` proves the validator still has teeth
  # against its own fixtures, then the bare run judges THIS repo's real files —
  # schemas ⇄ contract parity, and delivery.json against contract §7. python3 only
  # (no deps, no DB, no network); node is set up solely to run the npm scripts, which
  # are the same entry points humans use locally.
  pipeline-contract:
    name: Pipeline contract validators (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schema ⇄ contract parity selftest
        run: npm run test:schemas
      - name: Validate this repo's JSON documents against schemas/
        run: npm run check:schemas
      - name: delivery.json validator selftest (contract §7)
        run: npm run test:delivery
      - name: delivery.json validity (this repo has one since #392)
        run: npm run check:delivery
      # The Definition-of-Ready parser. `scripts/pipeline_dispatch_local.py` imports
      # `pin_fields` from it rather than reading a description its own way, so this
      # selftest is what keeps "the criteria on the pin are the criteria a human
      # wrote" true (§3). It also pins the parser against docs/TICKET-TEMPLATE.md,
      # which it parses the canonical section list out of.
      - name: Definition-of-Ready gate selftest
        run: npm run test:dor
      # Wired as of TOD-100. Six of its 56 cases are a drift check asserting that
      # three renderings of `sha256(realpath(root))[:16]` still agree — this
      # script, the pin-aware `.claude/hooks/pre-tool-use.py` (#397) and
      # `templates/workflows/pipeline-dispatch.yml` (ported here). Both
      # counterparties now exist, so a failure here is real drift rather than an
      # absent file — which is what this step was always meant to catch.
      - name: Local dispatcher selftest (contract §2, §3)
        run: npm run test:local-dispatch

      # The autonomy gates and the telemetry pipeline, ported alongside the
      # CI-side workflows that call them. Every one is INERT in this repo —
      # nothing under `templates/workflows/` runs, and there is no telemetry
      # store — so these selftests are the only thing holding them to the
      # contract. Without these steps the ported scripts would rot unnoticed.
      - name: Auto-approval gate selftest (contract §5, §11)
        run: npm run test:auto-approve

      - name: Auto-merge tier selftest (contract §11)
        run: npm run test:auto-merge

      - name: Telemetry scrape selftest (contract §4, §10)
        run: npm run test:telemetry-scrape

      - name: Telemetry block selftest (contract §4, §8)
        run: npm run test:telemetry-block

      - name: Lifecycle observer selftest (contract §4, §10)
        run: npm run test:telemetry-lifecycle

      - name: Dashboard selftest (self-contained page, one summary object)
        run: npm run test:telemetry-dashboard

      - name: Weekly-review limits selftest (no self-raised budgets or graders)
        run: npm run test:weekly-review

      # The staged workflows are inert, which means nothing else ever parses
      # them: a YAML syntax error, or a reference to a script that was renamed
      # away, would sit undetected until someone runs `git mv` to activate one —
      # the worst possible moment to find out. This step is the whole anti-rot
      # story for `templates/workflows/`, and its second half (referenced scripts
      # must exist) is what would have caught `pipeline-auto-merge.yml` arriving
      # without `scripts/check_auto_merge.py`.
      #
      # ACTIVATED pipeline workflows are checked here too (TOD-106). GitHub parses
      # a live workflow, but it does not check that the scripts one imports still
      # exist — and `pipeline-safe-outputs.yml` is `workflow_call` only, so GitHub
      # never runs it standalone at all. Without this, activating it would have
      # silently dropped the check that `scripts/telemetry_block.py` is still
      # there, and the first symptom would be a real session's writes being
      # rejected long after the rename that caused it.
      - name: Pipeline workflows parse, and their scripts exist
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import pathlib, re, sys, yaml

          bad = []
          staged = sorted(pathlib.Path("templates/workflows").glob("*.yml"))
          if not staged:
              sys.exit("no staged workflow templates found — did the directory move?")
          staged += sorted(pathlib.Path(".github/workflows").glob("pipeline-*.yml"))

          for f in staged:
              text = f.read_text(encoding="utf-8")
              try:
                  yaml.safe_load(text)
              except Exception as e:
                  bad.append("%s: unparseable YAML: %s" % (f, e))
                  continue
              for ref in sorted(set(re.findall(r"scripts/[A-Za-z0-9_.-]+\.py", text))):
                  if not pathlib.Path(ref).is_file():
                      bad.append("%s references %s, which does not exist" % (f, ref))

          if bad:
              print("::error::pipeline workflows are broken:")
              print("\n".join("  - " + b for b in bad))
              sys.exit(1)
          print("%d pipeline workflow(s), staged and active, parse — and every referenced script exists" % len(staged))
          EOF

      # Activation needs repo secrets and is a human action
      # (docs/PIPELINE-ACTIVATION.md). This step used to assert that NOTHING under
      # `templates/workflows/` had been copied into `.github/workflows/` at all —
      # a hard boundary, because the secrets did not exist yet and a half-wired
      # active workflow is worse than an inert one: it fires, fails, and buries
      # the reason in a log nobody is reading.
      #
      # That condition no longer holds — the GitHub App, PIPELINE_APP_ID,
      # PIPELINE_APP_KEY and ANTHROPIC_API_KEY now exist — so as of TOD-106 the
      # boundary is REVIEWED rather than HARD, and this step asserts a different
      # thing: every active pipeline workflow is named on the allowlist below.
      #
      # Be clear about what that does and does not buy. It does NOT prevent an
      # agent activating a workflow; nothing in CI can, since the same agent that
      # runs `git mv` can add the line. What it buys is that activation cannot be
      # QUIET: it has to show up as an explicit added line in a diff, sitting next
      # to the `git mv`, where the human reviewing the PR sees it. The real gate is
      # still a human reading and merging. The list is also the standing record of
      # what is intentionally live, which is why it is checked in both directions —
      # an entry naming a workflow that is not active is a stale record, not a
      # harmless leftover.
      #
      # `.github/workflows/**` is in `autonomy.riskPaths`, so a change here also
      # trips the scope fence. That is the intended second signal, not a bug.
      - name: Every active pipeline workflow is on the allowlist
        run: |
          set -euo pipefail

          # One line per DELIBERATELY ACTIVATED workflow. Adding a line here IS
          # the activation — it is meant to be reviewed alongside the `git mv`.
          ALLOWED='
          pipeline-safe-outputs.yml
          pipeline-failure-alert.yml
          pipeline-review.yml
          '

          fail=0

          # Direction 1 — nothing is live that the list does not name.
          for f in $(git ls-files '.github/workflows/pipeline-*.yml'); do
            if ! printf '%s\n' $ALLOWED | grep -qxF "${f##*/}"; then
              echo "::error::$f is active but is not on this step's allowlist."
              fail=1
            fi
          done

          # Direction 2 — the list names nothing that is not live, so it stays an
          # accurate record instead of drifting into a wishlist.
          for base in $ALLOWED; do
            if [ ! -f ".github/workflows/$base" ]; then
              echo "::error::the allowlist names $base, but it is not active in .github/workflows/."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "Activation is a reviewed step, not a forbidden one — see docs/PIPELINE-ACTIVATION.md."
            echo "Moving a pipeline workflow into .github/workflows/ means adding its filename to the"
            echo "allowlist in this step, in the same PR, so a reviewer sees the activation in the diff."
            exit 1
          fi

          echo "active pipeline workflows match the allowlist exactly:"
          git ls-files '.github/workflows/pipeline-*.yml'
