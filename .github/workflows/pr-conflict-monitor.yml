name: PR conflict monitor

# ══════════════════════════════════════════════════════════════════════════════
# Standing merge-conflict monitor — ported from claude-project-kit (TOD-125).
# The job below is the kit's, unchanged; scripts/pr_conflict.py is the kit's copy,
# byte for byte. Only this header is todoclaw's own.
#
# The hole: the Stop hook's DIRTY gate catches a conflicted PR only at turn-end, in
# the session that owns the branch. A PR that goes CONFLICTING later, when main moves
# under it, is invisible — GitHub cannot build the merge ref, so the required checks
# never run while side jobs still report green. The version this replaces (2026-08-25)
# labelled such a PR and commented a rebase recipe, and waited for a person.
#
# Now a conflict STARTS A FIX. Per new episode, with budget left (3 automated attempts
# per PR, lifetime), it labels the PR `conflict` and posts a `pr-conflict:request`
# comment. Whoever owns the branch's session answers it:
#   • a DISPATCHER's PR — the Stage E bounce driver sends the conflict back into that
#     session's own thread, in its sandbox. It already watches this repository.
#   • a LOCAL session's PR — the owner's conflict waker, if one is configured for a
#     checkout of this repository.
# No ack in 15 min, no result in 2 h, or a result while GitHub still says CONFLICTING
# → ESCALATE once: @mention and assign a person. A spent budget or a fork pages at once.
#
# WHO is paged: the PR_CONFLICT_PAGE_TO repository variable when set; else the PR's
# author when that is a person; else a person who owns the repository. It is not a
# secret (Settings → Secrets and variables → Actions → Variables).
#
# The label is the dedupe key: one request or page per episode, cleared when the PR is
# mergeable again. Drafts are skipped. THIS WORKFLOW NEVER MERGES, approves, rebases or
# pushes, and writes no label but `conflict`. A PR whose `mergeable` never settles fails
# the run: "could not tell" must never read as "no conflicts".
#
# Zero new secrets. Scheduled runs fire only from the default branch; use
# workflow_dispatch to test. The kit's union check (pr-union-check.yml) is not ported.
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,27,47 * * * *' # every 20 min: the ack deadline is only as prompt as the next tick
  workflow_dispatch:

permissions:
  contents: read
  issues: write # labels + comments on a PR go through the issues API
  pull-requests: write

# Three triggers can collide (a merge to main during a scheduled tick). Serialize
# rather than cancel: a cancelled run could die between "add label" and "post
# comment", leaving the dedupe key set with nothing explaining it.
concurrency:
  group: pr-conflict-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Scan open PRs for conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default-branch copy of the script (push/schedule/dispatch never check
      # out PR code), and no credential left in .git — this job never pushes.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Request fixes, escalate stalled ones, clear stale labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_CONFLICT_PAGE_TO: ${{ vars.PR_CONFLICT_PAGE_TO }}
        run: python3 scripts/pr_conflict.py monitor
